# Root SonarQube/SonarCloud configuration for the FounderLink workspace.
# This repo contains multiple standalone Maven services, so we scan them together.

sonar.projectKey=FounderLink
sonar.projectName=FounderLink
sonar.sourceEncoding=UTF-8
sonar.java.source=17

sonar.sources=api-gateway/src/main,auth-service/src/main,config-server/src/main,eureka-server/src/main,investment-service/src/main,messaging-service/src/main,notification-service/src/main,startup-service/src/main,team-service/src/main,user-service/src/main
sonar.tests=api-gateway/src/test,auth-service/src/test,config-server/src/test,eureka-server/src/test,investment-service/src/test,messaging-service/src/test,notification-service/src/test,startup-service/src/test,team-service/src/test,user-service/src/test

sonar.java.binaries=api-gateway/target/classes,auth-service/target/classes,config-server/target/classes,eureka-server/target/classes,investment-service/target/classes,messaging-service/target/classes,notification-service/target/classes,startup-service/target/classes,team-service/target/classes,user-service/target/classes
sonar.java.test.binaries=api-gateway/target/test-classes,auth-service/target/test-classes,config-server/target/test-classes,eureka-server/target/test-classes,investment-service/target/test-classes,messaging-service/target/test-classes,notification-service/target/test-classes,startup-service/target/test-classes,team-service/target/test-classes,user-service/target/test-classes

sonar.exclusions=**/target/**,**/logs/**,**/*.gz,**/.idea/**,**/.metadata/**,**/mvnw,**/mvnw.cmd,**/Dockerfile
sonar.coverage.exclusions=**/*Application.java,**/*Config.java,**/*Dto.java,**/*DTO.java,**/*Request.java,**/*Response.java,**/*Entity.java,**/*Repository.java
