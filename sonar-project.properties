# Root SonarQube/SonarCloud configuration for the FounderLink workspace.
# This repo contains multiple standalone Maven services, so we scan them together.

sonar.projectKey=FounderLink
sonar.projectName=FounderLink
sonar.sourceEncoding=UTF-8
sonar.java.source=17

sonar.sources=api-gateway/src/main,auth-service/src/main,config-server/src/main,eureka-server/src/main,investment-service/src/main,messaging-service/src/main,notification-service/src/main,startup-service/src/main,team-service/src/main,user-service/src/main,sprint frontend/founderlink/src/app,sprint frontend/founderlink/src/main.ts,sprint frontend/founderlink/src/styles.css
sonar.tests=api-gateway/src/test,auth-service/src/test,config-server/src/test,eureka-server/src/test,investment-service/src/test,messaging-service/src/test,notification-service/src/test,startup-service/src/test,team-service/src/test,user-service/src/test,sprint frontend/founderlink/src/app
sonar.test.inclusions=**/*.spec.ts

sonar.java.binaries=api-gateway/target/classes,auth-service/target/classes,config-server/target/classes,eureka-server/target/classes,investment-service/target/classes,messaging-service/target/classes,notification-service/target/classes,startup-service/target/classes,team-service/target/classes,user-service/target/classes
sonar.java.test.binaries=api-gateway/target/test-classes,auth-service/target/test-classes,config-server/target/test-classes,eureka-server/target/test-classes,investment-service/target/test-classes,messaging-service/target/test-classes,notification-service/target/test-classes,startup-service/target/test-classes,team-service/target/test-classes,user-service/target/test-classes

sonar.coverage.jacoco.xmlReportPaths=api-gateway/target/site/jacoco/jacoco.xml,auth-service/target/site/jacoco/jacoco.xml,config-server/target/site/jacoco/jacoco.xml,eureka-server/target/site/jacoco/jacoco.xml,investment-service/target/site/jacoco/jacoco.xml,messaging-service/target/site/jacoco/jacoco.xml,notification-service/target/site/jacoco/jacoco.xml,startup-service/target/site/jacoco/jacoco.xml,team-service/target/site/jacoco/jacoco.xml,user-service/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=sprint frontend/founderlink/coverage/lcov.info,sprint frontend/founderlink/coverage/founderlink/lcov.info

sonar.exclusions=**/target/**,**/logs/**,**/*.gz,**/.idea/**,**/.metadata/**,**/mvnw,**/mvnw.cmd,**/Dockerfile,**/node_modules/**,**/dist/**,**/coverage/**,sprint frontend/founderlink/src/**/*.spec.ts
sonar.coverage.exclusions=**/*Application.java,**/*Config.java,**/*Dto.java,**/*DTO.java,**/*Request.java,**/*Response.java,**/*Entity.java,**/*Repository.java,**/*Module.java,**/main.ts,**/app.config.ts,**/app.routes.ts,**/*.spec.ts

sonar.qualitygate.wait=true
